name: TW market data

# Official TWSE / TPEx / MOPS files, published here so a Google Sheet can read
# them through public URLs. Public data only: check_public.py runs before every
# commit and blocks anything personal.
on:
  schedule:
    - cron: "5 10 * * 1-5"   # 18:05 Taipei, weekdays
    - cron: "35 10 12 * *"   # 18:35 Taipei on the 12th
  push:
    branches: [main]
    paths: [scripts/fetch_tw.py, .github/workflows/tw.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tw-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch TWSE / TPEx / MOPS files
        run: python scripts/fetch_tw.py
      - name: Block personal data
        if: always()
        run: python scripts/check_public.py
      - name: Commit data
        if: always()
        shell: bash
        run: |
          python scripts/check_public.py || exit 1
          git config user.name "jc-market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tw
          git diff --cached --quiet || git commit -m "TW data $(date -u +%F)"
          git pull --rebase && git push
