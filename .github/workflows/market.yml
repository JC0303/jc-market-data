name: 官方大盤統計
on:
  schedule:
    - cron: '40 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-overview
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pytest
      - run: python -m pytest -q
      - name: 蒐集官方資料並保留失敗狀態
        id: fetch
        run: |
          set -o pipefail
          python scripts/fetch_market.py | tee "$RUNNER_TEMP/market.log"
      - name: 檢查公開資料並提交本次狀態
        if: "!cancelled() && (steps.fetch.outcome == 'success' || steps.fetch.outcome == 'failure')"
        run: |
          set -euo pipefail
          python scripts/check_public.py
          git add -- data/market
          if ! git diff --cached --quiet; then
            git config user.name jc-market-data-bot
            git config user.email actions@users.noreply.github.com
            git commit -m "更新官方大盤資料與來源狀態 $(date -u +%F)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
